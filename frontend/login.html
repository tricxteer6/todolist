<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/auth.css" />
  <script defer src="/js/auth.js"></script>
</head>
<body>
  <main class="auth-shell"><section class="auth-art"><a class="brand" href="/"><span>✦</span> taskflow<span>.</span></a><div class="art-copy"><p class="eyebrow">A calmer way to work</p><h1>Make space for<br><em>great work.</em></h1><p>Keep your tasks focused, personal, and moving forward.</p></div><div class="art-note">✦ <span>One clear task<br><b>at a time.</b></span></div></section><section class="auth-panel"><div class="auth-card"><p class="eyebrow" id="authKicker">Welcome back</p><h2 id="authTitle">Sign in to TaskFlow</h2><p class="auth-subtitle" id="authSubtitle">Your focused workspace is waiting.</p><form id="authForm"><label>Username<input id="usernameInput" autocomplete="username" placeholder="your username" required minlength="3" /></label><label>Password<input id="passwordInput" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="6" /></label><p class="auth-error" id="authError"></p><button class="auth-button" type="submit" id="authSubmit">Sign in <span>↗</span></button></form><p class="auth-switch" id="authSwitch">New to TaskFlow? <button type="button">Create an account</button></p></div></section></main>
</body>
</html>
